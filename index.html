<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OurLove</title>
<meta name="description" content="Für Jasmin • von Denis">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121734">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OurLove">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: Spielbühne oben (Aquarell-Szene), Erzählkarte aus Papier unten, Sternennacht als Grund. Bewusst ein einziges, nächtliches Farbthema. */
:root{
  --night:#121734; --violet:#2a2552; --gold:#f2c86b; --rose:#e98aa0; --paper:#f7f0e3; --paper2:#efe4cf;
  --ink:#2b2838; --inkSoft:#6a6478; --sage:#6f9b84; --line:#dccfb6;
  --display:"Cinzel", "Times New Roman", serif; --body:"Literata", Georgia, serif; --hand:"Caveat", "Segoe Print", cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--body);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:46px}
#chap{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--gold);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hearts{display:flex;gap:3px}
#hearts svg{width:18px;height:18px}
#hearts svg.lost{animation:lose .6s ease}
@keyframes lose{30%{transform:scale(1.5) rotate(-12deg)}100%{transform:scale(1)}}
.hb{width:38px;height:38px;border-radius:50%;border:1px solid rgba(242,200,107,.35);background:rgba(255,255,255,.04);color:var(--gold);display:grid;place-items:center;cursor:pointer;padding:0}
.hb svg{width:19px;height:19px}
.hb.bounce{animation:bounce .7s ease}
@keyframes bounce{30%{transform:scale(1.3)}60%{transform:scale(.9)}100%{transform:scale(1)}}
#stage{position:relative;width:100%;height:min(82vw,52vh);flex:0 0 auto;overflow:hidden;background:#1a1d3a}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .7s ease}
#stage.shake{animation:shake .45s}
#pcan{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#box{flex:1;min-height:0;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;margin-top:-14px;position:relative;z-index:2;padding:18px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overflow-y:auto;box-shadow:0 -10px 30px rgba(0,0,0,.35);cursor:pointer}
#box::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(150,120,80,.08) 1px,transparent 1px);background-size:5px 5px}
#speaker{font-family:var(--hand);font-size:21px;color:#c25a74;line-height:1}
#speaker small{font-family:var(--body);font-size:12px;color:var(--inkSoft);margin-left:6px;font-style:italic}
#text{font-size:17.5px;line-height:1.55;margin:0;min-height:3.1em;text-wrap:pretty}
#choices{display:grid;gap:9px}
.ch{font:500 16px var(--body);color:var(--ink);text-align:left;background:#fffaf0;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .12s,background .2s,border-color .2s;animation:rise .35s ease both}
.ch:active{transform:scale(.98)}
.ch:focus-visible,.hb:focus-visible,.btn:focus-visible{outline:2px solid #c25a74;outline-offset:2px}
.ch.right{background:#e3f1e6;border-color:var(--sage)}
.ch.wrong{background:#f8e0e4;border-color:#d07a8c;animation:shake .45s}
.ch[disabled]{cursor:default}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#hint{align-self:flex-end;font-family:var(--hand);font-size:18px;color:var(--inkSoft);animation:blink 1.4s ease-in-out infinite;margin-top:auto}
@keyframes blink{50%{opacity:.25}}
/* Minispiele */
.mg-heart{display:grid;justify-items:center;gap:10px;padding-top:4px}
.bigheart{width:120px;height:110px;border:none;background:none;cursor:pointer;padding:0;transition:transform .12s}
.bigheart svg{width:100%;height:100%;filter:drop-shadow(0 6px 12px rgba(194,90,116,.35))}
.bigheart.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.meter{width:100%;max-width:280px;height:14px;border-radius:7px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0a7b6,#c25a74);border-radius:7px}
.mlabel{font-family:var(--hand);font-size:19px;color:var(--inkSoft)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:#fffaf0;border:1.5px solid var(--line);cursor:pointer;font:500 13px var(--body);color:var(--ink);position:relative}
.tile svg{width:46px;height:38px}
.tile.ok{background:#e3f1e6;border-color:var(--sage);opacity:.55;cursor:default}
.tile.no{animation:shake .45s}
.tile.fly{animation:fly .5s ease forwards}
@keyframes fly{to{transform:translateY(-60px) scale(.4);opacity:0}}
.cookmsg{font-family:var(--hand);font-size:19px;color:#c25a74;min-height:1.3em;text-align:center}
/* Overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px 16px}
#title{background:radial-gradient(ellipse at 50% 35%,rgba(42,37,82,.9),rgba(18,23,52,.97) 70%);text-align:center}
.tin{display:grid;gap:14px;justify-items:center;max-width:420px}
.tsub{font-family:var(--hand);font-size:24px;color:var(--rose)}
.tname{font-family:var(--display);font-weight:700;font-size:clamp(46px,15vw,76px);line-height:1;letter-spacing:.04em;margin:0;background:linear-gradient(100deg,#f2c86b 20%,#fff3d6 40%,#e98aa0 60%,#f2c86b 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-250% 0}}
.tfor{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:#cfc6e6;text-transform:uppercase}
.btn{font:600 17px var(--body);border-radius:999px;padding:13px 26px;cursor:pointer;border:1.5px solid var(--gold);background:var(--gold);color:#2b2140}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.small{font-size:14px;padding:9px 16px}
.tamy{width:110px;height:80px}
.tnote{font-size:13px;color:#a9a2c4;max-width:32ch}
#card{background:#0e1230;overflow:hidden;cursor:pointer}
.blob{position:absolute;border-radius:50%;filter:blur(28px);opacity:.0;animation:bloom 2.6s ease-out forwards}
@keyframes bloom{0%{transform:scale(.1);opacity:0}40%{opacity:.75}100%{transform:scale(1);opacity:.55}}
.cin{position:relative;text-align:center;display:grid;gap:8px;animation:fadein 1.2s .4s ease both}
.cin .k{font-family:var(--display);font-size:14px;letter-spacing:.3em;color:#f6e6c4;text-transform:uppercase}
.cin .y{font-family:var(--display);font-weight:700;font-size:clamp(60px,20vw,104px);line-height:1;color:#fff6e2;text-shadow:0 0 30px rgba(242,200,107,.6)}
.cin .t{font-family:var(--hand);font-size:32px;color:#ffd3dd}
.cin .tap{font-size:13px;color:#cfc6e6;margin-top:18px;animation:blink 1.6s infinite}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
#fx{z-index:30;padding:0;cursor:pointer}
#fxc{position:absolute;inset:0;width:100%;height:100%}
#fxlabel{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(56px,18vw,96px);color:#fff4dc;text-shadow:0 0 24px rgba(242,200,107,.8)}
#fxlabel.stamp{font-size:clamp(34px,10vw,56px);animation:stamp .9s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.6s}
@keyframes stamp{from{transform:scale(3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
#fxsub{position:absolute;bottom:calc(14% + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-family:var(--hand);font-size:24px;color:#ffd3dd}
#pop{background:rgba(10,12,32,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.popcard{position:relative;background:var(--paper);color:var(--ink);border-radius:22px;padding:26px 22px 22px;max-width:340px;width:100%;text-align:center;display:grid;gap:8px;justify-items:center;animation:popin .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.popicon{width:150px;height:110px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}
.popcard .nw{font-family:var(--display);font-size:11px;letter-spacing:.2em;color:#b8862f;text-transform:uppercase}
.popcard h3{font-family:var(--hand);font-size:32px;margin:0;color:#c25a74;line-height:1}
.popcard p{margin:0 0 8px;font-size:15.5px;line-height:1.5;color:var(--inkSoft)}
.popcard .btn{background:#c25a74;border-color:#c25a74;color:#fff}
.spark{position:absolute;width:10px;height:10px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.3) rotate(45deg);opacity:.4}}
#album{background:rgba(10,12,32,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);place-items:stretch center;overflow-y:auto}
.alb{background:var(--paper);color:var(--ink);border-radius:22px;max-width:520px;width:100%;padding:20px 16px 18px;display:grid;gap:14px;align-content:start;margin-block:auto}
.alb header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.alb h2{font-family:var(--hand);font-size:34px;margin:0;color:#c25a74;line-height:1}
.alb .x{font:600 14px var(--body);background:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--ink)}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.aitem{border:1.5px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:4px;justify-items:center;text-align:center;background:#fffaf0;min-width:0}
.aitem svg{width:90px;height:64px}
.aitem .ay{font-family:var(--display);font-size:12px;letter-spacing:.12em;color:#b8862f}
.aitem .an{font-family:var(--hand);font-size:22px;line-height:1;color:var(--ink)}
.aitem .at{font-size:12.5px;line-height:1.4;color:var(--inkSoft)}
.aitem.locked{background:var(--paper2);border-style:dashed}
.aitem.locked .an{color:var(--inkSoft)}
.eggs{font-size:14px;color:var(--inkSoft);text-align:center}
.afoot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.afoot .btn{border-color:var(--line);background:transparent;color:var(--inkSoft)}
.afoot .btn.danger{border-color:#c25a74;color:#c25a74}
#end{background:radial-gradient(ellipse at 50% 40%,rgba(42,37,82,.97),rgba(14,18,48,.99));text-align:center;overflow-y:auto}
.bubble{position:absolute;z-index:3;transform:translate(-50%,-100%);background:#fffaf0;color:var(--ink);font-family:var(--hand);font-size:19px;line-height:1.15;padding:7px 12px;border-radius:14px;max-width:62%;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:bub 3s ease forwards;pointer-events:none;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fffaf0;border-bottom:0}
@keyframes bub{0%{opacity:0;transform:translate(-50%,-80%) scale(.8)}10%,85%{opacity:1;transform:translate(-50%,-100%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%)}}
#toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--gold);color:#2b2140;font:600 14px var(--body);padding:8px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:toast 2.6s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* Szenen-Animationen */
.char{cursor:pointer}
.bob{animation:bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.enter{animation:enter .9s ease both}
@keyframes bob{50%{transform:translateY(-2px) scaleY(1.01)}}
@keyframes enter{from{opacity:0;transform:translateX(40px)}}
.eyes{animation:eyes 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes eyes{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tail{animation:tail 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes tail{50%{transform:rotate(-14deg)}}
.tw{animation:twk 3s ease-in-out infinite}
@keyframes twk{50%{opacity:.25}}
.blinkr{animation:blr 1s steps(2,start) infinite}
@keyframes blr{to{visibility:hidden}}
.neon{animation:neon 4s infinite}
@keyframes neon{0%,18%,22%,60%,100%{opacity:1}20%,61%{opacity:.35}}
.steam{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes steam{0%{opacity:0;transform:translateY(6px) scaleX(.8)}40%{opacity:.7}100%{opacity:0;transform:translateY(-16px) scaleX(1.1)}}
.train{animation:train 5.5s linear forwards}
@keyframes train{from{transform:translateX(460px)}to{transform:translateX(-1300px)}}
.flick{animation:flick 3.2s ease-in-out infinite}
@keyframes flick{50%{opacity:.75}}
@media (prefers-reduced-motion: reduce){
  .bob,.eyes,.tail,.tw,.neon,.steam,.flick,.tname,.bigheart.pulse,.popicon,#hint,.spark{animation:none!important}
  .enter,.ch,.cin,.blob,.popcard{animation-duration:.01s!important}
  .train{animation:none;transform:translateX(-200px)}
}

/* Minispiel-Overlay */
#game{background:radial-gradient(ellipse at 50% 20%,#2a2552,#0e1230 75%);padding:0;place-items:stretch center;z-index:25}
.gwrap{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));gap:10px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.gtitle{font-family:var(--hand);font-size:28px;color:var(--rose);line-height:1}
.gstat{font:600 14px var(--body);color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
#garea{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#151a3c;touch-action:none;user-select:none;-webkit-user-select:none}
#garea canvas{position:absolute;inset:0;width:100%;height:100%}
.gpanel{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(14,18,48,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:5}
.gcard{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 20px;max-width:340px;width:100%;display:grid;gap:12px;text-align:center;animation:popin .5s cubic-bezier(.2,1.4,.4,1) both}
.gcard h3{font-family:var(--hand);font-size:32px;margin:0;color:#c25a74;line-height:1}
.gcard p{margin:0;font-size:15.5px;line-height:1.5;color:var(--inkSoft)}
.gcard .btn{background:#c25a74;border-color:#c25a74;color:#fff}
.gcard .btn.ghost{background:transparent;color:#c25a74}
.gfloat{position:absolute;z-index:4;transform:translate(-50%,-50%);font-family:var(--hand);font-size:26px;font-weight:700;pointer-events:none;animation:gfl 1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap}
@keyframes gfl{from{opacity:1;transform:translate(-50%,-50%) scale(.7)}30%{transform:translate(-50%,-70%) scale(1.15)}to{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.gfoot{display:flex;gap:10px;justify-content:center;min-height:0}
/* Zaubermarkt */
.mk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;background:linear-gradient(#f6e7c8,#e9d3a8)}
.mkdeck{position:relative;width:min(240px,70%);aspect-ratio:3/4}
.mkcard{position:absolute;inset:0;background:#fffaf0;border-radius:22px;border:2px solid #dccfb6;box-shadow:0 12px 28px rgba(60,40,20,.25);display:grid;place-items:center;align-content:center;gap:8px;font-family:var(--hand);font-size:30px;color:var(--ink);touch-action:none;cursor:grab}
.mkcard svg{width:70%;height:auto}
.mkcard.back{transform:scale(.94) translateY(10px);opacity:.7}
.mktag{position:absolute;top:16px;font:700 14px var(--body);padding:5px 10px;border-radius:8px;border:2px solid;opacity:0}
.mktag.yes{right:14px;color:#4f8a5f;border-color:#4f8a5f;transform:rotate(12deg)}
.mktag.no{left:14px;color:#c25a74;border-color:#c25a74;transform:rotate(-12deg)}
.mkbtns{display:flex;gap:14px}
.mkbtn{font:600 16px var(--body);border-radius:999px;padding:12px 20px;border:2px solid;cursor:pointer;background:#fffaf0}
.mkbtn.no{color:#c25a74;border-color:#c25a74}.mkbtn.yes{color:#4f8a5f;border-color:#4f8a5f}
.mkmsg{font-family:var(--hand);font-size:22px;color:#8a4a5a;min-height:1.2em;text-align:center}
/* Kochen */
.ck{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:16px;background:linear-gradient(#f7eedd,#efe1c4);color:var(--ink);overflow-y:auto}
.ck h4{font-family:var(--hand);font-size:26px;margin:0;color:#c25a74;text-align:center}
.ck .sub{font-size:14.5px;text-align:center;color:var(--inkSoft);margin:0}
.chop{display:grid;place-items:center;gap:8px;flex:1}
.chopbtn{width:min(220px,70%);aspect-ratio:1;border-radius:50%;border:none;background:radial-gradient(circle at 40% 35%,#fffaf0,#eadcbf);box-shadow:0 10px 24px rgba(80,50,20,.25);cursor:pointer;position:relative;display:grid;place-items:center}
.chopbtn svg{width:72%;height:72%}
.knife{position:absolute;right:-6%;top:-10%;width:46%;transition:transform .08s;transform-origin:80% 20%}
.chopbtn.hit .knife{transform:rotate(28deg) translate(-8%,18%)}
.big{font-family:var(--display);font-size:34px;color:#c25a74;font-variant-numeric:tabular-nums}
.tbar{position:relative;width:100%;max-width:320px;height:46px;border-radius:12px;background:linear-gradient(90deg,#f3d6a0 0 38%,#9fd3a6 38% 56%,#e9a58a 56% 100%);border:2px solid #d8c29c;margin:0 auto}
.tbar i{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;border-radius:3px;background:#2b2838}
.tlab{display:flex;justify-content:space-between;max-width:320px;width:100%;margin:0 auto;font-size:12.5px;color:var(--inkSoft)}
#garea.shake{animation:shake .4s}
.dooropen{transform-box:fill-box;transform-origin:100% 50%;animation:dopen .7s ease forwards}
@keyframes dopen{to{transform:scaleX(.14)}}

/* Memory */
.mem{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;background:linear-gradient(#a9d6ef,#f1dcb0);align-content:center}
.mcard{position:relative;aspect-ratio:3/4;border:none;background:none;padding:0;cursor:pointer;perspective:600px}
.mcard span{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .4s}
.mback{background:repeating-linear-gradient(45deg,#c25a74 0 10px,#d06a84 10px 20px);border:3px solid #fffaf0;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.mfront{background:#fffaf0;border:2px solid #dccfb6;transform:rotateY(180deg)}
.mfront svg{width:70%}
.mcard.up .mback{transform:rotateY(180deg)}.mcard.up .mfront{transform:rotateY(0)}
.mcard.ok .mfront{background:#e3f1e6;border-color:#6f9b84}
/* Drache */
.dr{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:12px;background:linear-gradient(#2a1f45,#4a2c5e);color:#fff3d6;overflow-y:auto}
.drboss{display:grid;justify-items:center;gap:6px}.drsvg{width:min(240px,70%)}.drbody{transition:transform .2s;transform-origin:center}

<script>
/* ================= FIGUREN (Anime-Stil) ================= */
const f1 = n => (+n).toFixed(1);
const HEART = "M12 21.3l-1.4-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.3z";
const CHAR_DEFS = `
<linearGradient id="gHairJ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2c1f"/><stop offset=".55" stop-color="#6e4630"/><stop offset="1" stop-color="#9a6a48"/></linearGradient>
<linearGradient id="gHairJ2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f251a"/><stop offset=".5" stop-color="#5e3b29"/><stop offset="1" stop-color="#8d5f40"/></linearGradient>
<linearGradient id="gDressJ" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#143327"/><stop offset=".45" stop-color="#2a5e49"/><stop offset=".6" stop-color="#245441"/><stop offset="1" stop-color="#11291f"/></linearGradient>
<linearGradient id="gBlz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34343f"/><stop offset=".5" stop-color="#23232b"/><stop offset="1" stop-color="#16161b"/></linearGradient>
<linearGradient id="gHairD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b3628"/><stop offset="1" stop-color="#2a1d16"/></linearGradient>
<linearGradient id="gSummerJ" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3dc8e"/><stop offset=".45" stop-color="#fff6cf"/><stop offset="1" stop-color="#ecd07a"/></linearGradient>
<linearGradient id="gBrideJ" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6e1ee"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#e2dcec"/></linearGradient>
<linearGradient id="gPalaceJ" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f7d6a"/><stop offset=".45" stop-color="#86c0aa"/><stop offset="1" stop-color="#386f5e"/></linearGradient>
<radialGradient id="gIrisJ" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#b08a58"/><stop offset=".6" stop-color="#6f5434"/><stop offset="1" stop-color="#3a2a1a"/></radialGradient>
<radialGradient id="gIrisD" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#8a6446"/><stop offset=".6" stop-color="#4c3322"/><stop offset="1" stop-color="#24170f"/></radialGradient>
<radialGradient id="gIrisA" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#e3f28f"/><stop offset=".7" stop-color="#a9cc55"/><stop offset="1" stop-color="#6f8f2c"/></radialGradient>`;

const SK = {
  j:{skin:"#f7dccb", sh:"#ebbfa9", line:"#9a6250", lid:"#2b1912", iris:"url(#gIrisJ)", lip:"#c4566c", brow:"#5a3828"},
  d:{skin:"#f1cfb7", sh:"#dbab92", line:"#8a5a46", lid:"#21160f", iris:"url(#gIrisD)", lip:"#b0675a", brow:"#2f2119"}
};
const EXPR = {
  neutral:{eye:"open", mouth:"soft", brow:"n", blush:.35},
  smile:{eye:"open", mouth:"smile", brow:"n", blush:.55},
  happy:{eye:"happy", mouth:"grin", brow:"n", blush:.7},
  laugh:{eye:"happy", mouth:"laugh", brow:"up", blush:.8},
  love:{eye:"heart", mouth:"smile", brow:"up", blush:1, hearts:true},
  blush:{eye:"open", look:.7, mouth:"soft", brow:"worry", blush:2},
  shy:{eye:"happy", mouth:"soft", brow:"worry", blush:2},
  surprised:{eye:"wide", mouth:"o", brow:"up", blush:.35},
  nervous:{eye:"open", mouth:"wobble", brow:"worry", blush:.7, sweat:true},
  awkward:{eye:"open", look:-1, mouth:"flat", brow:"worry", blush:1.6, sweat:true},
  determined:{eye:"open", mouth:"flat", brow:"angry", blush:.3},
  sleep:{eye:"closed", mouth:"soft", brow:"n", blush:.45},
  skeptic:{eye:"open", look:.6, mouth:"flat", brow:"skeptic", blush:.25},
  dreamy:{eye:"closed", mouth:"smile", brow:"up", blush:1, hearts:true},
  wink:{eye:"wink", mouth:"grin", brow:"n", blush:.7},
  pout:{eye:"open", look:-.6, mouth:"pout", brow:"worry", blush:1.3, puff:true},
  tearjoy:{eye:"happy", mouth:"grin", brow:"up", blush:1, tears:true},
  sparkle:{eye:"sparkle", mouth:"smile", brow:"up", blush:.8},
  smug:{eye:"half", mouth:"smirk", brow:"skeptic", blush:.3}
};
/* Posen: [Oberarm, Unterarm] in Grad, positiv = nach außen */
const POSES = {
  stand:{L:[9,-9], R:[9,-9]},
  wave:{L:[9,-9], R:[150,32]},
  cheer:{L:[150,30], R:[150,30]},
  hold:{L:[9,-9], R:[34,-4]},
  holdL:{L:[34,-4], R:[9,-9]},
  heart:{L:[24,-112], R:[24,-112]},
  carry:{L:[12,-78], R:[12,-78]},
  hips:{L:[42,-118], R:[42,-118]},
  point:{L:[9,-9], R:[95,-5]},
  cast:{L:[9,-9], R:[118,-10]},
  run1:{L:[-28,-40], R:[30,-50]},
  run2:{L:[30,-50], R:[-28,-40]}
};

function limb(l1, l2, a1, a2, w, col, line){
  const r1 = a1*Math.PI/180, ex = Math.sin(r1)*l1, ey = Math.cos(r1)*l1;
  const r2 = (a1+a2)*Math.PI/180, hx = ex + Math.sin(r2)*l2, hy = ey + Math.cos(r2)*l2;
  const d = `M0,0 L${f1(ex)},${f1(ey)} L${f1(hx)},${f1(hy)}`;
  return {ex, ey, hx, hy, r2,
    svg:`<path d="${d}" stroke="${line}" stroke-width="${w+1.5}" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="${d}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`};
}
const swing = (deg, dur, rev) => `<animateTransform attributeName="transform" type="rotate" values="${rev?deg:-deg} 0 0;${rev?-deg:deg} 0 0;${rev?deg:-deg} 0 0" dur="${dur}s" repeatCount="indefinite"/>`;

function eye(cx, cy, c, k, who, blinkBegin){
  const L = k.lid, mir = cx < 0 ? -1 : 1, g = who === "j" ? 1.25 : 1.1;
  if (c.eye === "wink") c = Object.assign({}, c, {eye: cx < 0 ? "happy" : "open"});
  const X = v => f1(cx + v*g), Y = v => f1(cy + v*g);
  if (c.eye === "happy") return `<path d="M${X(-3)},${Y(.9)} Q${X(0)},${Y(-2.8)} ${X(3)},${Y(.9)}" stroke="${L}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if (c.eye === "closed") return `<path d="M${X(-3)},${Y(0)} Q${X(0)},${Y(2)} ${X(3)},${Y(0)}" stroke="${L}" stroke-width="1.5" fill="none" stroke-linecap="round"/>${who==="j"?`<path d="M${X(3*mir)},${Y(0)} l${f1(1.3*mir)},-.7" stroke="${L}" stroke-width="1"/>`:""}`;
  if (c.eye === "heart") return `<path transform="translate(${X(-3.5)},${Y(-3.7)}) scale(${f1(.3*g)})" d="${HEART}" fill="#e2557a"/><path transform="translate(${X(-1.6)},${Y(-2.6)}) scale(.1)" d="${HEART}" fill="#fff" opacity=".8"/>`;
  const wide = c.eye === "wide", half = c.eye === "half", spark = c.eye === "sparkle", look = (c.look||0) * 1.1;
  const ry = wide ? 3.1 : 2.55, ir = wide ? 1.5 : 2.2;
  const ix = look, iy = -.1;
  const open = `<ellipse cx="${X(0)}" cy="${Y(-.1)}" rx="${f1(3*g)}" ry="${f1(ry*g)}" fill="#fff"/>
    <g class="rg-iris"><ellipse cx="${X(ix)}" cy="${Y(iy)}" rx="${f1(ir*g)}" ry="${f1((wide?ir:ir*1.18)*g)}" fill="${k.iris}"/>
    <ellipse cx="${X(ix)}" cy="${Y(iy+.15)}" rx="${f1(ir*.45*g)}" ry="${f1(ir*.58*g)}" fill="#140c08"/>
    <circle cx="${X(ix+.8)}" cy="${Y(iy-1.15)}" r="${f1(.8*g)}" fill="#fff"/><circle cx="${X(ix-.8)}" cy="${Y(iy+1)}" r="${f1(.38*g)}" fill="#fff" opacity=".85"/></g>
    <path d="M${X(-3.5)},${Y(.2)} Q${X(-.4)},${Y(wide?-4.4:-3.8)} ${X(3.5)},${Y(-.3)}" stroke="${L}" stroke-width="${who==="j"?1.7:1.45}" fill="none" stroke-linecap="round"/>
    ${who==="j"?`<path d="M${X(3.3*mir)},${Y(mir<0?.1:-.3)} l${f1(1.6*mir)},-1.1" stroke="${L}" stroke-width="1.2" stroke-linecap="round"/>`:""}
    <path d="M${X(-2.3)},${Y(2.3)} Q${X(0)},${Y(2.9)} ${X(2.3)},${Y(2.3)}" stroke="${L}" stroke-width=".6" fill="none" opacity=".45"/>`;
  const shut = `<path d="M${X(-3)},${Y(.2)} Q${X(0)},${Y(1.8)} ${X(3)},${Y(.2)}" stroke="${L}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;

  if (s && typeof s === "object" && !Array.isArray(s)) {
    if (s.look) for (const w in s.look) { const v = s.look[w]; if (v === "auto" || v == null) delete LIFE.hold[w]; else { LIFE.hold[w] = 1; gazeTarget(w, v); } }
    if (s.react) for (const w in s.react) react(w, s.react[w], s.ms);
    if (s.gest) for (const w in s.gest) [].concat(s.gest[w]).forEach(g => gest(w, g));
    if (s.light) LIFE.setMood(s.light === "auto" ? null : s.light, s.lightMs || 0);
    if (s.exit) { await Promise.all(Object.entries(s.exit).map(([w, h]) => lifeExit(w, h))); }
    if (s.sfx && /thump|wrong|thunder|hit/.test(s.sfx) || s.shake) Object.keys(CAST).forEach(w => { gest(w, "startle"); w === "a" && GEST.ear(lifeState("a")); });
    if (s.burst && s.on && CAST[s.on]) humans().filter(w => w !== s.on && !LIFE.hold[w]).forEach(w => gazeTarget(w, s.on));
    if (s.cam || s.focus) { LIFE.off.xT = 0; LIFE.off.zT = 1; LIFE.off.yT = 0; }
  }
  if (s && s.at && SVG && !reduce) { const at = {}; const moves = [];
    for (const w in s.at) { const v = Object.assign({}, s.at[w]), c = CAST[w];
      if (c && (("x" in v && Math.abs(v.x - c.x) > 1) || ("y" in v && Math.abs(v.y - c.y) > 1))) { const tx = "x" in v ? v.x : c.x, ty = "y" in v ? v.y : c.y; delete v.x; delete v.y; moves.push(glide(w, tx, ty)); }
      at[w] = v; }
    if (moves.length) { s = Object.assign({}, s, {at}); await Promise.all(moves); } }
  if (typeof s === "string" || (s && s.t)) onLine(s);
  else if (s && s.q) onLine(s.q); else if (s && s.quiz) onLine(s.quiz.q);
  return _step(s);
};

/* Sanftes Gleiten statt Springen (kurze Wege) oder Gehen (lange Wege) */
function glide(w, x, y){
  const c = CAST[w]; if (!c) return Promise.resolve(); const dx = x - c.x;
  if (Math.abs(dx) > 45 && Math.abs(y - c.y) < 2) return moveTo(w, x, lclamp(Math.abs(dx)*9, 600, 1800));
  const x0 = c.x, y0 = c.y, s = lifeState(w); if (y > y0 + 6) s.nodV += 20; else if (y < y0 - 6) s.hopV += 30;
  return tween(lclamp(Math.abs(dx)*12 + Math.abs(y - y0)*16, 380, 900), e => { c.x = x0 + (x - x0)*e; c.y = y0 + (y - y0)*e; const el = SVG && SVG.querySelector("#ch-" + w); el && el.setAttribute("transform", tf(c)); });
}

      if (shoot){ shoot.l+=0.02; const x=shoot.x+shoot.l*260, y=shoot.y+shoot.l*120; const g=cx.createLinearGradient(x-60,y-28,x,y); g.addColorStop(0,"rgba(255,246,220,0)"); g.addColorStop(1,"rgba(255,246,220,.9)"); cx.globalAlpha=1-shoot.l; cx.strokeStyle=g; cx.lineWidth=1.6; cx.beginPath(); cx.moveTo(x-60,y-28); cx.lineTo(x,y); cx.stroke(); if (shoot.l>=1) shoot=null; } }
    cx.globalAlpha=1; requestAnimationFrame(f); }
  requestAnimationFrame(f);
})();

/* ---------- 5. Herzklopfen (Rhythmus) ---------- */
herz:{ title:"Herzklopfen", mood:"night", how:"Hilf mir, Mut zu sammeln! Herzen fliegen zur Mitte. Tippe genau dann, wenn ein Herz im Ring ist. Schaffe 9 von 14.",
  start(area, api){
    const {cx, W, H} = api.canvas(); const C = [W/2, H*.52], beat = .78, N = 14, need = 9; let t = 0, hits = 0, done = 0, fb = null, lastBeat = -1;
    const notes = Array.from({length:N},(_,i)=>{ const a = [Math.PI, 0, -Math.PI/2, Math.PI*.75, Math.PI*.25][i % 5]; return {at:2 + i*beat, a, st:null}; });
    const R = Math.max(W, H)*.6;
    area.onpointerdown = () => { Music.init(); let best = null, bd = 9; notes.forEach(n => { if (n.st) return; const d = Math.abs(n.at - t); if (d < bd) { bd = d; best = n; } });
      if (best && bd < .22) { best.st = "hit"; hits++; done++; const p = bd < .08; fb = {t:p ? "Perfekt!" : "Gut!", l:.7}; Music.box(72 + hits*2, null, .1); }
      else fb = {t:"Zu früh", l:.5}; };
    api.loop(dt => {
      t += dt; const b = Math.floor((t - 2)/beat); if (b > lastBeat && b >= 0 && b < N) { lastBeat = b; Music.sfx("thump"); }
      notes.forEach(n => { if (!n.st && t > n.at + .22) { n.st = "miss"; done++; fb = {t:"Daneben", l:.5}; } });
      const g = cx.createRadialGradient(C[0], C[1], 10, C[0], C[1], R); g.addColorStop(0,"#3b2a5e"); g.addColorStop(1,"#0e1230"); cx.fillStyle = g; cx.fillRect(0,0,W,H);
      const pulse = 1 + .06*Math.max(0, Math.cos(((t - 2) % beat)/beat*Math.PI*2)); const hs = Math.min(W, H)*.62*pulse;
      cx.save(); cx.globalAlpha = .25; cHeart(cx, C[0], C[1] - hs*.55, hs, "#e98aa0"); cx.restore();
      cx.save(); cx.beginPath(); cx.rect(0, C[1] - hs*.55 + hs*(1 - hits/need), W, H); cx.clip(); cx.globalAlpha = .8; cHeart(cx, C[0], C[1] - hs*.55, hs, "#ef6f8f"); cx.restore();
      cx.strokeStyle = "#fff3d6"; cx.lineWidth = 3; cx.beginPath(); cx.arc(C[0], C[1], 26*pulse, 0, 7); cx.stroke(); cx.strokeStyle = "rgba(255,243,214,.3)"; cx.lineWidth = 10; cx.beginPath(); cx.arc(C[0], C[1], 26, 0, 7); cx.stroke();
      notes.forEach(n => { if (n.st === "hit") return; const k = (n.at - t)/1.6; if (k > 1) return; const d = Math.max(-.2, k)*R; const x = C[0] + Math.cos(n.a)*d, y = C[1] + Math.sin(n.a)*d; cx.globalAlpha = n.st === "miss" ? Math.max(0, 1 + k*5) : 1; cHeart(cx, x, y - 12, 24, n.st === "miss" ? "#6a6478" : "#ff8fab"); cx.globalAlpha = 1; });
      if (fb && fb.l > 0) { fb.l -= dt; cx.fillStyle = `rgba(255,243,214,${Math.min(1, fb.l*2)})`; cx.font = `700 ${Math.round(H*.06)}px Caveat, cursive`; cx.textAlign = "center"; cx.fillText(fb.t, C[0], C[1] - 50); cx.textAlign = "left"; }
      bar(cx, 16, 26, W - 32, 10, hits/need, "#ef6f8f", "Mut");
      api.stat(`Treffer ${hits} / ${need}`);
      if (done >= N && t > notes[N-1].at + .5) api.end(hits >= need, hits >= need ? `${hits} Treffer. Mein Herz ist bereit.` : `Nur ${hits} Treffer. Ich bin immer noch zu nervös. Nochmal?`);
    });
  }},

/* ---------- 2024: Zauber-Runen ---------- */
runen:{ title:"Zauber-Runen", mood:"play", how:"Im Zauberer-Theater in Hamburg lernst du drei Zaubersprüche. Fahre die leuchtende Rune mit dem Finger nach. Je genauer, desto stärker der Zauber!",
  start(area, api){
    const {cx, W, H} = api.canvas(); const C = [W/2, H*.52], R = Math.min(W, H)*.3; let idx = 0, path = [], drawing = false, flash = 0, msg = "", t = 0;
    const runes = [
      {n:"Herz-Zauber", pts:Array.from({length:60}, (_, i) => { const a = i/59*Math.PI*2; return [C[0] + 16*Math.pow(Math.sin(a),3)*R/17, C[1] - (13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a))*R/17]; })},
      {n:"Stern-Zauber", pts:(() => { const p = []; for (let i = 0; i <= 5; i++) { const a = -Math.PI/2 + i*Math.PI*4/5; p.push([C[0] + Math.cos(a)*R, C[1] + Math.sin(a)*R]); } const o = []; for (let i = 0; i < 5; i++) for (let k = 0; k < 12; k++) o.push([p[i][0] + (p[i+1][0] - p[i][0])*k/12, p[i][1] + (p[i+1][1] - p[i][1])*k/12]); return o; })()},
      {n:"Blitz-Zauber", pts:(() => { const p = [[C[0] + R*.3, C[1] - R], [C[0] - R*.3, C[1]], [C[0] + R*.3, C[1]], [C[0] - R*.3, C[1] + R]]; const o = []; for (let i = 0; i < 3; i++) for (let k = 0; k < 16; k++) o.push([p[i][0] + (p[i+1][0] - p[i][0])*k/16, p[i][1] + (p[i+1][1] - p[i][1])*k/16]); return o; })()}
    ];
    const score = () => { const rp = runes[idx].pts; if (path.length < 10) return 0; const near = (a, list) => list.some(b => Math.hypot(a[0] - b[0], a[1] - b[1]) < 26); const cov = rp.filter(p => near(p, path)).length/rp.length, acc = path.filter(p => near(p, rp)).length/path.length; return Math.min(cov, acc); };
    area.onpointerdown = e => { Music.init(); drawing = true; path = [pointer(area, e)]; };
    area.onpointermove = e => { if (drawing) { path.push(pointer(area, e)); if (path.length % 4 === 0) Music.tone && Music.ctx && Music.on && Music.box(84 + (path.length/4 % 8), null, .02); } };
    area.onpointerup = () => { if (!drawing) return; drawing = false; const s = score(); if (s >= .72) { flash = 1; msg = `${runes[idx].n}: ${Math.round(s*100)} %!`; Music.sfx("right"); idx++; path = []; if (idx >= runes.length) setTimeout(() => api.end(true, "Drei Zauber gemeistert. Hamburg ist offiziell verzaubert."), 900); } else { msg = `Nur ${Math.round(s*100)} %. Nochmal!`; Music.sfx("wrong"); path = []; } };
    api.loop(dt => {
      t += dt; flash -= dt;
      const g = cx.createRadialGradient(C[0], C[1], 10, C[0], C[1], H); g.addColorStop(0,"#3a2a5e"); g.addColorStop(1,"#0e0b22"); cx.fillStyle = g; cx.fillRect(0,0,W,H);
      for (let i = 0; i < 50; i++) { cx.fillStyle = `rgba(255,246,220,${.2 + .5*Math.abs(Math.sin(t*.8 + i))})`; cx.beginPath(); cx.arc((i*131) % W, (i*71) % H, 1.2, 0, 7); cx.fill(); }
      if (flash > 0) { cx.fillStyle = `rgba(242,200,107,${flash*.4})`; cx.fillRect(0,0,W,H); }
      if (idx < runes.length) { const rp = runes[idx].pts; cx.save(); cx.shadowColor = "#9fe0ff"; cx.shadowBlur = 12; cx.strokeStyle = `rgba(159,224,255,${.45 + .25*Math.sin(t*3)})`; cx.lineWidth = 10; cx.lineCap = "round"; cx.lineJoin = "round"; cx.setLineDash([2, 14]); cx.beginPath(); rp.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1])); cx.stroke(); cx.setLineDash([]); cx.restore();
        cx.fillStyle = "#f2c86b"; cx.beginPath(); cx.arc(rp[0][0], rp[0][1], 8 + Math.sin(t*6)*2, 0, 7); cx.fill(); TH(cx, runes[idx].n, W/2, H*.1, 30, "#ffd3dd"); }
      if (path.length > 1) { cx.strokeStyle = "#f2c86b"; cx.lineWidth = 5; cx.lineCap = "round"; cx.shadowColor = "#f2c86b"; cx.shadowBlur = 14; cx.beginPath(); path.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1])); cx.stroke(); cx.shadowBlur = 0; }

tanz:{ title:"Mitternachtstanz", mood:"play", how:"Füssen, das Cinderella-Musical! Tanzt bis Mitternacht: Tippe die Spur an, wenn ein Stern die Linie erreicht. Schaffe 18 von 26 Schritten.",
  start(area, api){

    const notes = Array.from({length:N}, (_, i) => ({at:2 + i*beat + (i > 13 ? (i - 13)*-.06 : 0), lane:[1,0,2,1,2,0,1,1,0,2,2,0,1,2,0,1,2,1,0,0,2,1,2,0,1,1][i], st:null}));
    const lx = l => W*(.2 + l*.3);
    area.onpointerdown = e => { Music.init(); const [x] = pointer(area, e); const lane = x < W*.35 ? 0 : x < W*.65 ? 1 : 2; let best = null, bd = 9; notes.forEach(n => { if (n.st || n.lane !== lane) return; const d = Math.abs(n.at - t); if (d < bd) { bd = d; best = n; } });
      if (best && bd < .2) { best.st = "hit"; hits++; done++; fb = {t:bd < .07 ? "Perfekt!" : "Gut!", l:.5, lane}; Music.box([72,76,79][lane] + 12, null, .1); } else fb = {t:"Stolper!", l:.4, lane}; };
    api.loop(dt => {
      t += dt; const b = Math.floor((t - 2)/beat); if (b > lastB && b >= 0 && b < N) { lastB = b; Music.tone && Music.ctx && Music.on && Music.tone(48, Music.ctx.currentTime, .12, .12, "sine"); }
      notes.forEach(n => { if (!n.st && t > n.at + .2) { n.st = "miss"; done++; } });
      const g = cx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#1a1f45"); g.addColorStop(1,"#5a3a6e"); cx.fillStyle = g; cx.fillRect(0,0,W,H);
      const prog = Math.min(1, t/(notes[N-1].at + .5)); const clk = [W*.85, H*.12]; cx.fillStyle = "#fffaf0"; cx.beginPath(); cx.arc(clk[0], clk[1], 26, 0, 7); cx.fill(); cx.strokeStyle = "#2b2838"; cx.lineWidth = 3; const ma = -Math.PI/2 + (prog*.25 - .25)*Math.PI*2; cx.beginPath(); cx.moveTo(clk[0], clk[1]); cx.lineTo(clk[0] + Math.cos(ma)*20, clk[1] + Math.sin(ma)*20); cx.moveTo(clk[0], clk[1]); cx.lineTo(clk[0], clk[1] - 14); cx.stroke();
      [0,1,2].forEach(l => { cx.fillStyle = "rgba(255,255,255,.06)"; cx.fillRect(lx(l) - W*.12, 0, W*.24, H); });
      cx.strokeStyle = "#f2c86b"; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(0, lineY); cx.lineTo(W, lineY); cx.stroke(); [0,1,2].forEach(l => { cx.strokeStyle = "rgba(242,200,107,.6)"; cx.beginPath(); cx.arc(lx(l), lineY, 24, 0, 7); cx.stroke(); });
      notes.forEach(n => { if (n.st === "hit") return; const k = (n.at - t)/1.8; if (k > 1 || k < -.2) return; const y = lineY - k*lineY*.9; cx.save(); cx.translate(lx(n.lane), y); cx.rotate(t*2); cx.fillStyle = n.st === "miss" ? "#6a6478" : "#dff0fb"; cx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 7 : 16, a = i*Math.PI/5; cx.lineTo(Math.cos(a)*r, Math.sin(a)*r); } cx.fill(); cx.restore(); });
      if (fb && fb.l > 0) { fb.l -= dt; TH(cx, fb.t, lx(fb.lane), lineY - 50, 26, "#fff3d6"); }
      if (prog >= 1) { TH(cx, "Mitternacht!", W/2, H*.4, 40, "#f2c86b"); }
      api.stat(`Schritte ${hits}/${need}`);
      if (done >= N && t > notes[N-1].at + 1) api.end(hits >= need, hits >= need ? `${hits} perfekte Schritte. Um Mitternacht bleibt ein gläserner Schuh zurück.` : `${hits} Schritte. Die Uhr war schneller. Nochmal tanzen?`);
    });

    else { fall.y += H*1.6*dt; const top = stack[stack.length - 1]; if (fall.y >= H*.2) {

const pWait = ms => new Promise(r => setTimeout(r, ms));

c3_beach:{ steps:[
  {scene:{bg:"beach", music:"day", cast:{j:c({x:-40, y:282, expr:"happy", ...CAS}), d:c({x:-90, y:282, expr:"smile", ...CAS})}}},

  {mv:{j:[160, 1600], d:[230, 1800]}},
  {ex:{j:"laugh"}, po:{j:"cheer"}, burst:"sparks", on:"j"},

  {po:{j:"stand"}, focus:"d", z:2.3},
  {ex:{d:"nervous"}},
  "Ich glaube, ich werde rot. Und nicht vor Verliebtheit.",
  {wide:1},
  {game:"sonne"},
  {ex:{d:"laugh", j:"smile"}},
  "Danke, Heilerin. Ohne dich wäre ich jetzt eine Paprika.",
  {q:"Was machst du als Erstes am Strand?", o:[
    {t:"Füße ins Meer", r:[{ex:{j:"happy"}}, "Kalt! Aber herrlich. Ich komme mit, natürlich."]},
    {t:"Unter den Schirm mit einem Buch", r:[{ex:{j:"dreamy"}}, "Drachen, Magie und große Gefühle. Du bist sofort in einer anderen Welt."]},
    {t:"Muscheln suchen", r:[{ex:{j:"smile"}}, "Gute Idee. Ich helfe tragen."]}]},
  "Apropos Muscheln: Der Strand ist voll davon. Aber die Wellen sind schnell.",
  {game:"muscheln"},
  {act:"collect", item:"muschel"}

c3_plaza:{ steps:[
  {scene:{bg:"plaza", music:"day", fx:"petals", cast:{d:c({x:150, y:284, expr:"nervous", ...CAS}), j:c({x:230, y:284, expr:"smile", ...CAS, pose:"point"})}}},
  "Am Nachmittag: die Altstadt. Weiße Häuser, Orangenbäume, enge Gassen.",
  "Ich bin verpeilt, du hast den Plan. Wie immer.",
  {po:{j:"stand"}, ex:{d:"smile"}},
  "Damit wir nichts von diesem Tag vergessen: ein Erinnerungs-Memory.",
  {game:"memory"},
  {ex:{j:"happy", d:"love"}, burst:"hearts", on:"d"}
 ], next:"c3_sunset"},
c3_sunset:{ steps:[
  {scene:{bg:"sunset", music:"night", cast:{d:c({x:178, y:288, expr:"smile", ...CAS, pose:"hold"}), j:c({x:228, y:288, expr:"smile", ...CAS, pose:"holdL"})}}},

  {cam:{x:203, y:170, z:2}, ms:2200},
  {ex:{j:"dreamy", d:"dreamy"}},
  "Eigentlich ist die ganze Klasse dabei. Aber gefühlt sind wir ganz allein.",
  {wide:1, ms:1200},
  {quiz:{q:"Erinnerungs-Quiz: Was stand auf dem Leuchtschild in Ottbergen?", o:["PADA","KINO","JASMIN","DENIS"], a:2,
    right:[{ex:{j:"laugh", d:"awkward"}}, "Richtig. Und wir werden immer noch rot, wenn wir dran denken."],
    wrong:[{ex:{d:"laugh"}}, "Nein, da stand dein Name. Ich weiß, du hast es verdrängt."]}},
  {sfx:"egg", shake:1},
  {t:"Mrrrau!", s:"Eine Stimme aus der Zukunft"},
  {ex:{j:"surprised", d:"surprised"}},
  "Hast du das auch gehört? Klingt, als würde bald jemand sehr Wichtiges zu uns stoßen."
 ], next:"p3"},

/* ---------- Kapitel 4 · 2020 ---------- */
c4_abi:{ steps:[
  {scene:{bg:"abi", music:"day", cast:{j:{x:160, y:282, expr:"happy", hat:"grad"}, d:{x:240, y:282, expr:"happy", hat:"grad"}}}},
  "2020. Das Abi ist geschafft!",
  {po:{j:"cheer", d:"cheer"}, burst:"confetti"},
  "Drei Jahre Oberstufe. Angefangen mit einem freien Platz neben mir.",
  "Und jetzt, Tradition: Alle Hüte fliegen in die Luft!",
  {game:"huete"},
  {act:"stamp", text:"ABI 2020", sub:"Geschafft. Zusammen.", kind:"hats"},
  {act:"collect", item:"abi"},
  {po:{j:"stand", d:"stand"}, ex:{j:"smile", d:"smile"}},
  "Und dann trennen sich unsere Wege. Zumindest tagsüber."
 ], next:"c4_care"},
c4_care:{ steps:[
  {scene:{bg:"care", music:"day", cast:{j:{x:120, y:286, expr:"determined", outfit:"nurse"}}}},
  "Du startest deine Ausbildung zur Pflegefachfrau. Im ambulanten Dienst.",
  {act:"stamp", text:"AUSBILDUNG", sub:"Die Heilerin legt los"},
  {ex:{j:"smile"}},
  "Erster Tag, erste Tour. Viele Häuser, viele Omis und Opas, ein Auto.",
  {game:"tour"},
  {ex:{j:"happy"}},
  "Die Omis lieben dich. Natürlich."
 ], next:"c4_bi"},
c4_bi:{ steps:[
  {scene:{bg:"bielefeld", music:"day", cast:{d:{x:200, y:290, expr:"neutral", outfit:"shirt"}}}},
  "Und ich? Starte meine Ausbildung zum Fachangestellten für Arbeitsmarktdienstleistungen. In Bielefeld.",
  {focus:"d", z:2.2},
  {ex:{d:"nervous"}},
  "Viel Zug fahren. Wenig Zeit. Du im Schichtdienst, ich in Bielefeld.",
  "Wir sehen uns kaum. Das ist die schwerste Phase für uns.",
  {wide:1, music:"tense", sfx:"thunder", shake:1},
  "Und dann taucht er auf: der Schichtplan-Drache. Er frisst jeden freien Abend.",
  {ex:{d:"determined"}},
  {game:"drache"},
  {ex:{d:"happy"}, music:"day"},
  "Drei Abende zu zweit, zurückerobert. Wir schaffen das. Immer."
 ], next:"c4_amy"},
c4_amy:{ steps:[
  {scene:{bg:"living", music:"day", fx:"sparkle", cast:{j:c({x:120, y:284, expr:"smile", ...CAS}), d:c({x:190, y:284, expr:"smile", ...CAS})}}},
  "Und dann passiert 2020 das Wichtigste überhaupt.",
  {ex:{j:"surprised", d:"surprised"}},
  {focus:"j", z:1.6, dx:80},

  {act:"stamp", text:"AMY", sub:"Unser ein und alles"},

  "Am Anfang ist sie vorsichtig. Sehr vorsichtig. Sie versteckt sich unter dem Sofa.",
  {game:"vertrauen"},
  {scene:{bg:"living", music:"day", fx:"sparkle", cast:{j:c({x:120, y:284, expr:"happy", ...CAS}), d:c({x:190, y:284, expr:"smile", ...CAS}), a:{x:290, y:284, expr:"love"}}}},
  {focus:"a", z:2.4, h:40},
  {t:"Mrrrau.", s:"Amy"},

  {wide:1},
  {act:"collect", item:"halsband"}
 ], next:"c4_end"},
c4_end:{ steps:[
  {scene:{bg:"living", music:"night", hide:{id:"h20", x:338, y:238, s:.45}, cast:{j:c({x:150, y:284, expr:"smile", ...CAS}), d:c({x:215, y:284, expr:"smile", ...CAS})}}},
  "Ab jetzt hat Amy ein Talent: Sie versteckt sich überall.",
  "In jedem Kapitel ist sie irgendwo in einer Szene versteckt. Wenn du sie siehst: antippen!",
  {quiz:{q:"Erinnerungs-Quiz: Welches Gericht hast du 2018 als Kräuterheilerin gekocht?", o:["Ramen","Pasta Aglio e Olio","Pizza","Sushi"], a:1,
    right:[{ex:{j:"happy"}}, "Genau. Mit perfekt gehacktem Knoblauch."], wrong:[{ex:{d:"surprised"}}, "Es war Pasta Aglio e Olio. Der Speck-Baron dreht sich im Grab um."]}},
  "Kapitel 4 geschafft. Und jetzt sind wir zu dritt."

  {scene:{bg:"boxes", music:"day", cast:{j:c({x:-40, y:286, expr:"skeptic", ...CAS}), d:c({x:-90, y:286, expr:"happy", ...CAS, pose:"carry"})}}},

  "Dir gefällt sie nicht so richtig.",
  {focus:"d", z:2.3},
  {ex:{d:"love"}},
  "Ich dagegen bin einfach nur froh. Wir wohnen zusammen!",

  {act:"collect", item:"schluessel"}

c5_deko:{ steps:[
  {scene:{bg:"living", music:"day", cast:{j:c({x:160, y:284, expr:"skeptic", ...CAS}), d:c({x:230, y:284, expr:"smile", ...CAS})}}},

  {game:"deko"},
  {ex:{j:"happy", d:"love"}, burst:"hearts", on:"j"},

    {t:"Denis!", r:[{ex:{d:"awkward"}}, "Verstanden."]},
    {t:"Denis.", r:[{ex:{d:"awkward"}}, "Auch verstanden."]},
    {t:"Natürlich Denis.", r:[{ex:{d:"awkward"}}, "Ich sehe schon, das war keine echte Frage."]}]},
  {ex:{j:"laugh"}},
  "Ich bringe den Müll raus. Wie immer. Fast immer."
 ], next:"c5_vamp"},
c5_vamp:{ steps:[
  {scene:{bg:"living", music:"night", hide:{id:"h21", x:96, y:132, s:.4}, cast:{d:c({x:130, y:284, expr:"smile", ...CAS}), j:{x:220, y:284, expr:"nervous", outfit:"nurse"}}}},
  "Unser Ritual, jeden Morgen, wenn du zur Arbeit gehst:",

  {po:{d:"stand"}, ex:{j:"awkward"}},
  "Heute hilft das nur bedingt. Es ist: Doppelschicht.",
  {music:"tense", sfx:"thunder", shake:1},

  {ex:{j:"determined"}, po:{j:"cast"}},
  {game:"vampir"},
  {scene:{bg:"living", music:"night", hide:{id:"h21", x:96, y:132, s:.4}, cast:{d:c({x:150, y:284, expr:"love", ...CAS, pose:"hold"}), j:{x:205, y:284, expr:"dreamy", outfit:"nurse", pose:"holdL"}}}},
  "Feierabend. Unsere Begrüßung nach der Arbeit. Mein Lieblingsmoment des Tages.",
  {quiz:{q:"Erinnerungs-Quiz: Wer hat dich 2018 auf dem Zaubermarkt angegriffen?", o:["Der Salami-Ritter","Der Speck-Baron","Die Leberwurst-Lady","Der Schnitzel-König"], a:1,
    right:[{ex:{j:"laugh"}}, "Der Speck-Baron. Heute nur noch Räuchertofu."], wrong:[{ex:{d:"laugh"}}, "Es war der Speck-Baron. Aber die anderen klingen auch gefährlich."]}}
 ], next:"p5"},

/* ---------- Kapitel 6 · 2022 ---------- */

  {scene:{bg:"garage", music:"day", hide:{id:"h22", x:168, y:226, s:.42}, cast:{j:c({x:240, y:286, expr:"happy", ...CAS}), d:c({x:310, y:286, expr:"smile", ...CAS})}}},

 ], next:"c6_night"},

  {wait:500},

 ], next:"c6_film"},

  {scene:{bg:"living", music:"night", cast:{j:c({x:200, y:284, expr:"happy", ...CAS}), d:c({x:265, y:284, expr:"happy", ...CAS}), a:{x:330, y:284}}}},
  "Abends: unser Filmabend. Mit Essensbestellung. Heilig.",

    {t:"Ramen", r:[{ex:{j:"dreamy"}}, "Ramen. Und ein Anime dazu. Perfekt."]},

  {focus:"a", z:2.4, h:40},

/* ---------- Kapitel 7 · 2023 ---------- */
c7_exam:{ steps:[
  {scene:{bg:"exam", music:"tense", cast:{j:c({x:200, y:290, expr:"nervous", ...CAS})}}},
  "2023. Das große Jahr.",
  "Erst: dein Examen. Drei Jahre Ausbildung, alles läuft auf diesen Moment zu.",
  {ex:{j:"determined"}},
  {game:"examen"},
  {act:"stamp", text:"BESTANDEN!", sub:"Examinierte Pflegefachfrau"},
  {scene:{bg:"bielefeld", music:"day", cast:{d:{x:200, y:290, expr:"happy", outfit:"shirt", pose:"cheer"}}}},
  "Und ich? Habe meine Ausbildung auch bestanden!",

 ], next:"c7_ams"},
c7_ams:{ steps:[
  {scene:{bg:"amsterdam", music:"day", fx:"petals", cast:{j:c({x:160, y:290, expr:"happy", ...CAS}), d:c({x:230, y:290, expr:"smile", ...CAS})}}},
  "Zur Belohnung: unser erster gemeinsamer privater Urlaub. Amsterdam!",

  {t:"Kling kling!", s:"Ein Fahrrad"},
  {game:"fahrrad"},
  {act:"collect", item:"tulpe"}
 ], next:"c7_iburg"},

  {scene:{bg:"iburg", music:"night", cast:{j:{x:150, y:288, expr:"smile"}, d:{x:220, y:288, expr:"nervous"}}}},

  {focus:"d", z:2.5},
  "Ich bin so nervös wie damals auf der Klassenfahrt. Eher noch nervöser.",

  {wide:1},
  "Nach dem Essen schlage ich vor: Lass uns noch auf den Turm gehen.",
  {game:"turm"}
 ], next:"c7_tower"},
c7_tower:{ steps:[
  {scene:{bg:"tower", music:"night", cast:{j:{x:170, y:292, expr:"smile"}, d:{x:236, y:292, expr:"nervous"}}}},

  {at:{d:{y:318}}, po:{d:"holdL"}, ex:{d:"blush", j:"surprised"}},

  {at:{d:{y:292}}, po:{d:"stand"}, ex:{j:"laugh", d:"love"}, burst:"hearts", on:"j"},
  {at:{j:{ring:1, expr:"dreamy"}}},
  {act:"fireworks", stamp:"01.09.2023", sub:"Ja, ich will"},
  {ex:{j:"dreamy", d:"dreamy"}},
  "Du hast „Ja, ich will“ gesagt. Auf einem Turm. Unter den Sternen.",
  {act:"collect", item:"ring"}
 ], next:"c7_party"},
c7_party:{ steps:[
  {scene:{bg:"party", music:"day", fx:"sparkle", cast:{j:{x:170, y:286, expr:"surprised", ring:1}, d:{x:240, y:286, expr:"happy"}}}},

  {po:{j:"wave"}},

  {wide:1, po:{j:"stand"}}

  {scene:{bg:"living", music:"night", hide:{id:"h23", x:236, y:180, s:.38}, cast:{j:c({x:150, y:284, expr:"dreamy", ring:1, ...CAS}), d:c({x:300, y:284, expr:"smile", ...CAS})}}},
  "Zurück zu Hause. Wo ist eigentlich Amy?",

  "Urteil: akzeptabel.",

const STORY = {

  after(id, pred, add){ const i = this.find(id, pred); if (i >= 0) N[id].steps.splice(i + 1, 0, ...add); },
  before(id, pred, add){ const i = this.find(id, pred); if (i >= 0) N[id].steps.splice(i, 0, ...add); },
  outfit(ids, who, props){ ids.forEach(id => (N[id] && N[id].steps || []).forEach(s => { if (s && s.scene && s.scene.cast && s.scene.cast[who]) Object.assign(s.scene.cast[who], props); })); },
  hasAmy(id){ const n = N[id]; if (!n) return false; const sc = [...n.steps].reverse().find(s => s && s.scene); return !!(sc && sc.scene.cast && sc.scene.cast.a); }
};

const CH_QUIZ = {};
Object.entries(N).forEach(([id, n]) => { const ch = chapterOf(id); const walk = a => (a || []).forEach(s => { if (s && s.quiz) (CH_QUIZ[ch] = CH_QUIZ[ch] || []).push(s.quiz.q.slice(0, 40)); if (s && s.o) s.o.forEach(o => walk(o.r)); }); walk(n.steps); });
function chapterBalance(ch){
  const games = Object.keys(GAMEMETA).filter(g => GAMEMETA[g].ch === ch && GAMES[g]);
  const st = games.reduce((a, g) => a + (S.best[g] || 0), 0);
  const amys = AMY_BY_CH[ch] || [], af = amys.filter(id => (S.found || []).includes(id)).length;
  const items = Object.entries(ITEMS).filter(([, it]) => it.year === 2016 + ch), got = items.filter(([k]) => S.album.includes(k));
  const qz = CH_QUIZ[ch] || [], qok = qz.filter(q => S.quizOk.includes(q)).length;
  const row = (ok, label, val) => `<div class="bal ${ok ? "ok" : ""}"><span class="bi">${ok ? "✓" : "·"}</span><span>${label}</span><b>${val}</b></div>`;
  const tips = [];
  if (amys.length && af < amys.length) tips.push("Irgendwo in diesem Kapitel hat sich Amy versteckt. Tippe sie an, wenn du sie siehst.");
  const low = games.filter(g => (S.best[g] || 0) < 3).map(g => GAMES[g].title);
  if (low.length) tips.push(`Mehr Sterne möglich: ${low.slice(0, 3).join(", ")}${low.length > 3 ? " …" : ""}`);
  if (qz.length && qok < qz.length) tips.push("Eine Quizfrage wartet noch auf die richtige Antwort.");
  return `<div class="balance"><h4>Kapitel-Bilanz</h4>
    ${games.length ? row(st === games.length*3, "Minispiele", `${st}/${games.length*3} ★`) : ""}
    ${games.map(g => `<div class="balg"><span>${GAMES[g].title}</span>${starsHtml(S.best[g] || 0)}</div>`).join("")}
    ${amys.length ? row(af === amys.length, "Amy gefunden", `${af}/${amys.length}`) : ""}
    ${items.length ? row(got.length === items.length, "Erinnerungen", `${got.length}/${items.length}`) : ""}
    ${qz.length ? row(qok === qz.length, "Quiz richtig", `${qok}/${qz.length}`) : ""}
    ${tips.length ? `<p class="baltip">${tips.join("<br>")}</p><p class="baltip small">Jedes Kapitel kannst du jederzeit im Menü unter „Kapitel wählen“ wiederholen.</p>` : `<p class="baltip gold">Alles gefunden. Amy ist beeindruckt.</p>`}</div>`;
}

  prolog1:{start:"Hallo. Ich bin's, Amy. Diesmal erzähle ICH mit. Denis darf auch noch ein bisschen.", m:[["sehr launische Katze","Launisch? Ich bin konsequent. Das ist ein Unterschied."],["Eigentlich kommt sie erst 2020","Zeitreisen sind für Katzen kein Problem. Wir sind ja auch durch geschlossene Türen gekommen."],["Oben siehst du deine Herzen","Herzen verlieren ist nicht schlimm. Ich bringe sie zurück. Gegen Leckerli."]], end:"Los geht's. Ich setze mich in jede Szene. Ihr werdet mich nicht los."},

  c1_drive:{start:"Autofahren. Mein Erzfeind Nummer zwei, direkt nach der Transportbox.", end:"Ich hoffe, er hat sich angeschnallt. Und Musik ausgesucht, die ich mag."},
  c1_cinema:{start:"Kino. Ein dunkler Raum, in dem man still sitzen muss. Klingt nach meinem Mittagsschlaf.", m:[["Popcorn","Popcorn! Ich hätte jedes einzelne vom Boden aufgesammelt. Mit dem Mund."]], end:"Ich hätte während des Films auf Denis' Schoß gelegen. Er hätte nichts mehr gesehen. Perfekt."},
  c1_food:{start:"Essen. Endlich ein Kapitel, das ich verstehe.", m:[["Sesambällchen fangen an zu fliegen","Fliegendes Essen. Das ist mein Traum. Jede Nacht."]], end:"Ich hätte mir den Fisch bestellt. Und eure Sesambällchen probiert. Alle."},
  c1_crossing:{start:"Achtung, peinlichster Moment der Geschichte. Ich habe extra Popcorn mitgebracht.", m:[["dein Name","Ich lache nicht. Katzen lachen nicht. Ich schnurre nur sehr verdächtig."],["schweigend weiter","Schweigen, bis es vorbei ist. Das mache ich auch immer, wenn ich etwas umgeworfen habe."]], end:"Ottbergen. Ich werde diesen Ort nie wieder vergessen. Und ihr auch nicht."},
  c1_hostel:{start:"Klassenfahrt. Viele Menschen in einem Haus. Ich hätte mich unter dem Bett versteckt.", m:[["Auf dieser Fahrt frage ich dich","Er hat einen Plan. Pläne von Denis funktionieren meistens. Irgendwann. Mit Hilfe."]], end:"Spannung! Ich putze mich vor Aufregung."},
  c1_room:{start:"Der 28. September. Ab hier zählt die Zeitrechnung. Erst ohne Amy. Mit Amy kam später.", m:[["Mein Herz klopft so laut","Ich höre Herzen. Seins klang wie eine Waschmaschine im Schleudergang."],["Seitdem ist der 28. September unser Tag","Und meiner. Ich bekomme an dem Tag Leckerli. Das habe ich so beschlossen."]], end:"Ich bin ehrlich gerührt. Kurz. Dann will ich Futter."},
  c2_market:{start:"Ein Markt! Voller Gerüche! Und dann das …", m:[["kein Fleisch mehr","Kein Fleisch für die Menschen. Für mich bitte weiter Thunfisch. Danke."],["Ich trage ihn natürlich","Gentleman. Er trägt auch mich. Wenn ich es erlaube. Selten."]], end:"Vegetarisch. Respekt. Ich bleibe Fleischfresserin aus Tradition."},
  c2_storm:{start:"Ein Baron aus Speck. Ich habe da ein paar … Fragen.", m:[["der Speck-Baron","Ich verteidige Jasmin. Aber ich würde auch kurz an ihm schnuppern. Nur schnuppern."]], end:"Räuchertofu. Ich bin enttäuscht. Aber ich verzeihe."},
  c2_kitchen:{start:"Die Küche. Der heiligste Ort im Haus. Gleich nach dem Bett.", m:[["Aglio e Olio","Knoblauch. Bah. Ich gehe ins Wohnzimmer. Aber ich beobachte euch."],["Leberwurst","Leberwurst! Wo?! Ach so. Gar nicht. Gemein."]], end:"Es duftet. Nach Knoblauch. Ich rümpfe die Nase, aber bleibe in der Nähe."},
  c2_dessert:{start:"Matcha. Grün. Schaumig. Ich verstehe es nicht, aber ich respektiere es.", end:"Wenn sie Matcha trinkt, ist sie glücklich. Und wenn sie glücklich ist, krault sie mich. Matcha ist gut."},

  c3_beach:{start:"Málaga. Sand. Sehr viel Sand. Das ist im Grunde ein riesiges Katzenklo. Ich sag ja nur.", m:[["ostwestfälischen Haut","Denis wird rot. Ich werde nie rot. Ich bin schwarz-weiß. Praktisch."],["Muscheln","Muscheln sind wie Spielzeug, nur langweiliger."]], end:"Wasser. Viel Wasser. Ich wäre auf dem Handtuch geblieben. Für immer."},
  c3_plaza:{start:"Weiße Häuser. Ich hätte auf jedem Dach gesessen.", m:[["du hast den Plan","Jasmin hat immer den Plan. Ich habe den Plan, wann es Futter gibt. Zusammen sind wir unschlagbar."]], end:"Erinnerungen sammeln. Ich sammle Haargummis. Unter dem Sofa."},
  c3_sunset:{start:"Sonnenuntergang. Das ist die Zeit, in der ich anfange, durch die Wohnung zu rennen.", m:[["ganz allein","Ganz allein. Ohne mich. Noch."],["jemand sehr Wichtiges","Ja. Ich. Ihr habt es geahnt."]], end:"Spürt ihr das? Das bin ich. Ich komme näher."},
  c4_abi:{start:"Abi! Hüte fliegen. Ich hätte jeden einzelnen gejagt.", m:[["einem freien Platz neben mir","Der freie Platz. Immer wieder der freie Platz. Ich hätte ihn längst besetzt."]], end:"Abschluss geschafft. Ich habe auch einen Abschluss: Kissen-Expertin."},
  c4_care:{start:"Pflege. Jasmin kümmert sich um alle. Bei mir übt sie täglich.", m:[["Die Omis lieben dich","Natürlich lieben die Omis sie. Ich liebe sie ja auch. Meistens."]], end:"Wenn sie nach der Tour nach Hause kommt, lege ich mich auf ihre Füße. Das ist Pflege für die Pflegerin."},
  c4_bi:{start:"Bielefeld. Gibt es das überhaupt? Ich bin skeptisch.", m:[["Wir sehen uns kaum","Das ist traurig. Wenn ich da gewesen wäre, hätte ich beide gleichzeitig getröstet."],["Schichtplan-Drache","Ein Drache. Ich hätte ihn angefaucht. Einmal. Das reicht meistens."]], end:"Sie haben es geschafft. Weil sie zusammenhalten. Wie ich und mein Lieblingskarton."},
  c4_amy:{start:"Und jetzt: ICH. Bitte Applaus. Danke. Ihr dürft euch setzen.", m:[["unter dem Sofa","Unter dem Sofa ist es sicher. Und man sieht alle Füße. Strategisch klug."],["Zoomies um drei Uhr nachts","Drei Uhr nachts ist die beste Zeit. Da ist niemand im Weg."]], end:"Ab jetzt ist das hier offiziell meine Geschichte."},
  c4_end:{start:"Verstecken ist keine Schüchternheit. Es ist Kunst.", end:"Zu dritt. Ich bin die Wichtigste von drei. Statistisch gesehen."},

  c6_car:{start:"Ein grünes Auto. Ich habe mehrere Fragen und keine davon ist freundlich.", m:[["Lupo","Lupo. Ein Name wie ein Katzenspielzeug. Ich mag ihn ein bisschen."]], end:"Solange ich nicht mitfahren muss, finde ich den Lupo toll."},
  c6_night:{start:"Nacht. Meine Zeit. Ich patrouilliere.", m:[["Wecker","Ich bin übrigens auch ein Wecker. Ich funktioniere um vier Uhr. Ohne Batterien."]], end:"Schnarchen ist für Katzen wie Hintergrundmusik. Ich liebe Denis' Album."},
  c6_film:{start:"Filmabend. Bestellung. Das ist der beste Abend der Woche.", m:[["Sushi","SUSHI. Ich habe nichts gesagt. Ich setze mich nur ganz zufällig neben die Tüte."],["Amy möchte auch was","Ich möchte nicht auch was. Ich möchte ALLES. Das wurde bereits dokumentiert."]], end:"Ich habe nichts bekommen. Offiziell. Inoffiziell: ein Stück Lachs. Psst."},
  c7_exam:{start:"Examen. Jasmin lernt. Ich liege auf dem Buch. Das hilft beim Lernen. Glaubt mir.", m:[["Und ich? Habe meine Ausbildung auch bestanden","Beide bestanden. Ich habe auch bestanden: Fensterbank-Sitzen, Note eins."]], end:"Zwei Abschlüsse. Und ich habe beide Diplome mit meinen Haaren veredelt."},
  c7_ams:{start:"Amsterdam. Ohne mich. Ich habe zu Hause Protest geschlafen.", m:[["Million Fahrräder","Eine Million Fahrräder und kein einziges mit Katzenkorb. Enttäuschend."]], end:"Ihr kommt zurück. Natürlich. Hier ist ja der Napf."},
  c7_iburg:{start:"Die Iburg. Denis ist nervös. Er hat etwas in der Tasche. Ich kenne diesen Blick.", m:[["eine kleine Schachtel","Eine Schachtel! Eine KLEINE Schachtel. Mein Lieblingsformat."]], end:"Ich hätte die Schachtel ja vorher getestet. Aber mich hat keiner gefragt."},
  c7_tower:{start:"Psst. Jetzt kommt der wichtigste Moment. Ich bin ganz still. Ganz. Still.", m:[["Und dann gehe ich auf die Knie","Er kniet. Ich kenne das nur, wenn er mein Klo saubermacht."]], end:"Ja. Sie hat Ja gesagt. Ich habe nicht geweint. Ich hatte nur Fell im Auge."},
  c7_party:{start:"Eine Feier. Viele Leute. Ich bin dann mal unter dem Bett.", m:[["Alle waren eingeweiht","Alle waren eingeweiht. Ich auch. Ich habe nichts verraten. Katzen sind diskret."]], end:"Alle wollen den Ring sehen. Ich auch. Ich will ihn unter das Sofa rollen."},
  c7_home:{start:"Zu Hause. Endlich Ruhe. Und ein glänzendes Ding an Jasmins Hand.", m:[["Urteil: akzeptabel","Akzeptabel ist von mir das größte Lob. Merkt euch das."]], end:"Ich habe den Ring geprüft. Er riecht nach Glück. Und ein bisschen nach Denis."},
  c8_theater:{start:"Zaubertheater. Ich kann auch zaubern. Ich lasse Socken verschwinden.", m:[["Ein bisschen Magie kannst du auch","Jasmin kann Magie. Sie öffnet Thunfischdosen, ohne hinzusehen."]], end:"Magie ist, wenn das Futter von allein in den Napf kommt. Das passiert bei uns täglich."},
  c8_castle:{start:"Ein Schloss! Ich bin eine Prinzessin. Das wusstet ihr, oder?", m:[["Tanzen wir bis Mitternacht?","Mitternacht ist meine Lieblingszeit. Da tanze ich auch. Alleine. Im Flur."]], end:"Gläserner Schuh. Ich hätte ihn vom Tisch geschubst. Klirr. Tradition."},
  c8_study:{start:"Studium. Laptops. Mein Lieblingsheizkissen.", m:[["Ich bin so stolz auf dich","Ich bin auch stolz. Ich zeige es, indem ich mich auf die Hausarbeit lege."]], end:"Sie schafft alles. Ich schaffe es, im Weg zu liegen. Wir sind ein Team."},
  c9_mount:{start:"Berge. Hohe Orte. Ich hätte mich oben auf den Gipfel gesetzt und runtergeschaut.", m:[["Vika","Vika wohnt in den Bergen. Ich wohne auf dem Kühlschrank. Gleiche Idee."]], end:"Wer so hoch wohnt, versteht Katzen. Ich mag Vika."},

  c9_home:{start:"Ihr wart weg. Ich war beleidigt. Ich bin es immer noch. Ein bisschen.", m:[["Unverzeihlich","Unverzeihlich. Aber ich verzeihe euch. Gegen zwei Leckerli. Und Bauch kraulen. Nein, doch kein Bauch."]], end:"Fürs Protokoll: Ich habe euch vermisst. Sagt es niemandem."},
  c10_cellar:{start:"Umzug. Der Keller ist voller Kartons. Ich wiederhole: VOLLER KARTONS.", m:[["Bücher. Romantasy und Comics","Bücher sind wie Kartons, nur flacher. Ich lege mich auf alle."]], end:"Ich habe jeden Karton persönlich geprüft. Keiner war leer genug."},
  c10_box:{start:"Achtung. Jetzt kommt die Transportbox. Ich bitte um Verständnis für die folgenden Szenen.", m:[["Ihr Erzfeind","Erzfeind ist noch freundlich formuliert."],["sehr beleidigt aus der Box","Beleidigt? Ich bin nicht beleidigt. Ich bin enttäuscht. Das ist schlimmer."]], end:"Ich bin dabei. Weil ihr dabei seid. Das ist das Einzige, was zählt."},
  c10_flat:{start:"Eine leere Wohnung. Eine Matratze. Das ist ein riesiges Bett für mich. Und zwei Gäste.", m:[["Aber wir drei","Wir drei. Das ist der schönste Satz dieser Geschichte. Ich habe nachgezählt."]], end:"Durchs Fenster sehen wir die Sterne. Und ich sehe euch. Gute Nacht."},
